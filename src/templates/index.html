<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="dashboard-title">{{ title }}</h1>
        <div class="status-indicator">
          <span class="status-dot online" id="statusDot"></span>
          <span class="status-text" id="statusText">Live</span>
        </div>
      </div>
      <div class="header-right">
        <div class="clock-date" id="clockDate">--</div>
        <div class="clock-time" id="clockTime">--:--:--</div>
      </div>
    </header>

    <!-- Alerts Banner Container -->
    <div id="alertsContainer" class="alerts-container"></div>

    <!-- Main Transit Grid -->
    <main id="transitGrid" class="transit-grid">
      <div class="loading-placeholder">Loading live MBTA transit data...</div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-left">t-minus-pi</div>
      <div class="footer-right" id="lastUpdated">Last updated: --</div>
    </footer>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
